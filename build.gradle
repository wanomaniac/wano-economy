def mcVersion = System.getenv("MINECRAFT_VERSION")
        ?: project.findProperty("minecraft_version")
        ?: ext.mc_version

ext.minecraft_version = mcVersion

configurations.configureEach {
    resolutionStrategy {
        cacheChangingModulesFor 0, 'seconds'  // always refresh
        cacheDynamicVersionsFor 0, 'seconds'  // optional
    }
}

apply from: file("AutoModLoaderVersion.gradle")

tasks.withType(Javadoc).configureEach {
    enabled = false
}

configure([project(':fabric'), project(':neoforge')]) { subproj ->
    subproj.afterEvaluate {
        tasks.named('processResources', ProcessResources) {
            def loaderId = subproj.name

            def resolvedRange = VersionUtil.formatVersionRange(
                    VersionUtil.getEffectiveVersionRangeArray(rootDir.path, minecraft_version, loaderId)
            )

            def expandProps = [
                    'version'                        : version,
                    'group'                          : project.group,
                    'minecraft_version'              : minecraft_version,
                    'minecraft_version_range'        : resolvedRange,
                    'mod_name'                       : mod_name,
                    'mod_author'                     : mod_author,
                    'mod_id'                         : mod_id,
                    'license'                        : license,
                    'description'                    : project.description,
                    'credits'                        : credits,
                    'java_version'                   : java_version,
                    // Safe fallbacks for loader-specific properties
                    'fabric_version'                 : subproj.findProperty('fabric_version') ?: '',
                    'fabric_loader_version'          : subproj.findProperty('fabric_loader_version') ?: '',
                    'neoforge_version'               : subproj.findProperty('neoforge_version') ?: '',
                    'neoforge_loader_version_range'  : subproj.findProperty('neoforge_loader_version_range') ?: '',
                    'forge_version'                  : subproj.findProperty('forge_version') ?: '',
                    'forge_loader_version_range'     : subproj.findProperty('forge_loader_version_range') ?: ''
            ]

            def jsonExpandProps = expandProps.collectEntries { key, value ->
                [(key): value instanceof String ? value.replace("\n", "\\\\n") : value]
            }

            filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
                expand expandProps
            }

            filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
                expand jsonExpandProps
            }

            inputs.properties(expandProps)
        }
    }
}
